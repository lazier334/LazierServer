name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build  # 如果有构建脚本
    
    - name: Create ZIP package
      run: |
        mkdir -p dist
        # 排除指定文件夹，创建zip包
        zip -r release.zip . -x "*.git/*" ".github/*" ".vscode/*" ".idea/*" "node_modules/*" "dist/*"
        mv release.zip dist/
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/release.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
