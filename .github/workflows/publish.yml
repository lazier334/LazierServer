name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.3.3-26072102 或 1.3.4 ）不写则不修改版本号'
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 用于 OIDC 认证

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Update version from input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "$INPUT_VERSION" != "$CURRENT_VERSION" ]; then
            npm version "$INPUT_VERSION" --no-git-tag-version
          else
            echo "Version unchanged, skipping npm version"
          fi

      - name: Check if version exists on npm
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} already exists on npm, will skip publish."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is new, will publish."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.exists != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ $VERSION == *-* ]]; then
            # 预发布版本（如 1.3.3-26072102）→ 使用 next 标签
            npm publish --provenance --access public --tag next
          else
            # 正式版本（如 1.3.4）→ 使用 latest 标签（默认）
            npm publish --provenance --access public
          fi