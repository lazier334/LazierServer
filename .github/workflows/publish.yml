name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      action:
        description: '选择操作 (publish: 推送next版本 promote: 标记latest版本)'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote
          - publish
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 用于 OIDC 认证

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # ---- promote：将 latest 指向当前 next 的版本 ----
      - name: Promote latest to next
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote'
        run: |
          PACKAGE_NAME="lazierserver"
          NEXT_VERSION=$(npm view "$PACKAGE_NAME" dist-tags.next)

          if [ -z "$NEXT_VERSION" ]; then
            echo "Error: next tag not found for $PACKAGE_NAME"
            exit 1
          fi

          echo "Next version: $NEXT_VERSION"
          npm dist-tag add "$PACKAGE_NAME@$NEXT_VERSION" latest
          echo "Done: latest now points to $NEXT_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- publish：发布新版本 ----
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'publish'
        run: npm ci

      - name: Check version for push tags
        id: version_check
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'publish'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" -lt 1 ]; then
            echo "Push tag with version $VERSION (<1.0.0) - skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version exists on npm
        id: check_version
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'publish') && steps.version_check.outputs.skip != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} already exists on npm, will skip publish."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is new, will publish."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'publish') && steps.check_version.outputs.exists != 'true' && steps.version_check.outputs.skip != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ $VERSION == *-* ]]; then
            # 预发布版本（如 1.3.3-26072102）→ 使用 next 标签
            npm publish --provenance --access public --tag next
          else
            # 正式版本（如 1.3.4）→ 使用 latest 标签（默认）
            npm publish --provenance --access public
          fi
